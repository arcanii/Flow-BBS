<?xml version="1.0" encoding="UTF-8"?>
<!--
  The type page of the board's demonstrations: type.png is this, set by
  Inkscape (Pango and HarfBuzz: kerning, ligatures, vertical Japanese):

    inkscape type.svg -w 1600 -o type.png

  then cut to 64 colors. Its faces are free (the SIL Open Font License):
  Noto Serif JP and TC, Noto Sans JP, and Cascadia Code.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif JP'; fill: #1f1c18; }
      .sans { font-family: 'Noto Sans JP'; fill: #1f1c18; }
      .mono { font-family: 'Cascadia Code'; fill: #1f1c18; }
      .red { fill: #b5322a; }
      .soft { fill: #6b6157; }
    </style>
  </defs>
  <rect x="8" y="8" width="1584" height="984" rx="30" fill="#f5f0e6" stroke="#d8cdb9" stroke-width="3"/>

  <!-- The head: a running title, tracked out, over a rule. -->
  <text x="80" y="104" class="sans red" font-size="25" font-weight="600" letter-spacing="7">THE ÁNIË SOLUTIONS BBS · A PAGE OF TYPE</text>
  <rect x="80" y="128" width="1080" height="2.5" fill="#b5322a"/>

  <!-- One word in two weights. -->
  <text x="72" y="282" class="serif" font-size="168"><tspan font-weight="900">Type</tspan><tspan font-weight="200">set</tspan></text>

  <text class="serif" font-size="35" font-weight="400">
    <tspan x="80" y="400">Flow draws its letters in one face, a cell at a time.</tspan>
    <tspan x="80" y="448">A board can send type in any face, set as a picture,</tspan>
    <tspan x="80" y="496">and Flow shows it among the cells.</tspan>
  </text>

  <!-- A face at five of its weights. -->
  <text x="80" y="582" class="serif" font-size="44"><tspan font-weight="200">Light</tspan><tspan class="soft" font-weight="400">&#160;·&#160;</tspan><tspan font-weight="400">Regular</tspan><tspan class="soft" font-weight="400">&#160;·&#160;</tspan><tspan font-weight="500">Medium</tspan><tspan class="soft" font-weight="400">&#160;·&#160;</tspan><tspan font-weight="700">Bold</tspan><tspan class="soft" font-weight="400">&#160;·&#160;</tspan><tspan font-weight="900">Black</tspan></text>

  <!-- A sans, kerned; a monospace, its ligatures joined. -->
  <text x="80" y="658" class="sans" font-size="40" font-weight="500">Sphinx of black quartz, judge my vow. AV Ty Wa</text>
  <text x="80" y="728" class="mono" font-size="33">let bbs = dial("anie"); // =&gt; != &lt;= &gt;= -&gt;</text>

  <!-- Sizes, each half again the last. -->
  <text class="serif" font-weight="600">
    <tspan x="80" y="900" font-size="24">Aa</tspan>
    <tspan dx="26" font-size="36">Aa</tspan>
    <tspan dx="26" font-size="54">Aa</tspan>
    <tspan dx="26" font-size="81">Aa</tspan>
    <tspan dx="26" font-size="121">Aa</tspan>
  </text>

  <!-- Japanese, set down the page; and Japanese and Chinese across it. -->
  <rect x="1200" y="60" width="2.5" height="880" fill="#d8cdb9"/>
  <text x="1524" y="92" class="serif" font-size="50" font-weight="600" style="writing-mode: vertical-rl; text-orientation: upright;">東京と香港から、端末に活字を。</text>
  <text x="1446" y="92" class="serif red" font-size="26" font-weight="500" style="writing-mode: vertical-rl;">日本語・縦書き</text>
  <text x="1236" y="816" class="serif" font-size="40" font-weight="700">組版の美しさ</text>
  <text x="1236" y="880" font-family="Noto Serif TC" fill="#1f1c18" font-size="40" font-weight="700">排版之美</text>
  <text x="1404" y="880" class="sans soft" font-size="18" font-weight="500">繁體中文</text>

  <text x="80" y="962" class="sans soft" font-size="19" font-weight="400">Set in Noto Serif JP and TC, Noto Sans JP and Cascadia Code, faces free under the SIL Open Font License.</text>
</svg>
