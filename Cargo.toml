[workspace]
members = ["sdk", "server", "doors/cat", "boards/anie"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arcanii/Flow-BBS"

[workspace.dependencies]
flow-sdk = { git = "https://github.com/arcanii/Flow-SDK", tag = "v0.1.3" }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
